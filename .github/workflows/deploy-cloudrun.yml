name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    # A docs-only push changes nothing in the image; no code reads .md at runtime.
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# One deploy at a time: cleanup must not race a revision that is still rolling out.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  REGION: asia-east1
  SERVICE: csl-portfolio
  AR_REPO: containers

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${GITHUB_SHA::7}"
          # One plain manifest per deploy: without these, buildx pushes an index plus
          # an attestation, and cleanup has to work out which pieces belong together.
          docker build --provenance=false --sbom=false -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          # Conversation history and rate limits live in process memory, so one
          # instance keeps them consistent and also caps what abuse can cost.
          flags: --max-instances=1

      - name: Show deployed URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"

      - name: Health check
        run: curl --fail --retry 5 --retry-delay 10 --retry-all-errors "${{ steps.deploy.outputs.url }}/api/health"

      # Keep only the revision serving traffic and its image. A failure here
      # must not fail the deploy that already succeeded.
      - name: Clean up old revisions and images
        continue-on-error: true
        shell: bash
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          REPO="${REGION}-docker.pkg.dev/${PROJECT}/${AR_REPO}/${SERVICE}"
          RUN_ARGS=(--region "$REGION" --project "$PROJECT")

          SERVING=$(gcloud run services describe "$SERVICE" "${RUN_ARGS[@]}" --format=json \
            | jq -r '.status.traffic[].revisionName // empty')
          # An empty list here would delete the live revision too.
          [ -n "$SERVING" ] || { echo "no serving revisions found; skip cleanup"; exit 1; }
          for rev in $(gcloud run revisions list --service "$SERVICE" "${RUN_ARGS[@]}" --format='value(metadata.name)'); do
            if ! grep -qx "$rev" <<<"$SERVING"; then
              echo "delete revision $rev"
              gcloud run revisions delete "$rev" "${RUN_ARGS[@]}" --quiet
            fi
          done

          RUNNING=$(gcloud run revisions list --service "$SERVICE" "${RUN_ARGS[@]}" --format=json \
            | jq -r '.[].status.imageDigest // empty | split("@")[1]')
          IMAGES=$(gcloud artifacts docker images list "$REPO" --project "$PROJECT" --format=json)
          # Stop if what is running cannot be found, rather than guess and delete it.
          [ -n "$RUNNING" ] || { echo "no running image digests; skip image cleanup"; exit 1; }
          for digest in $RUNNING; do
            jq -e --arg d "$digest" 'any(.[]; .version == $d)' <<<"$IMAGES" >/dev/null \
              || { echo "running image $digest not in repository; skip image cleanup"; exit 1; }
          done

          KEEP="$RUNNING"

          # Indexes first, for images built before --provenance=false: their children
          # cannot go while the index still references them.
          for digest in $(jq -r 'sort_by(.metadata.mediaType | test("index|list") | not) | .[].version' <<<"$IMAGES"); do
            if ! grep -qx "$digest" <<<"$KEEP"; then
              echo "delete image $digest"
              gcloud artifacts docker images delete "${REPO}@${digest}" --project "$PROJECT" --delete-tags --quiet
            fi
          done
